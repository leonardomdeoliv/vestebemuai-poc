server:
  port: 8080

spring:
  application:
    name: monolito
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vestebemuai}
    username: ${DB_USER:vestebemuai}
    password: ${DB_PASSWORD:vestebemuai}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  # Sprint 2: o monolito publica o evento PedidoCriado no RabbitMQ.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:vestebemuai}
    password: ${RABBITMQ_PASSWORD:vestebemuai}

vestebemuai:
  email:
    remetente: pedidos@vestebemuai.com.br
  notificacao:
    # fila     = publica PedidoCriado e o servico de notificacoes envia o e-mail (padrao, Sprint 2)
    # sincrono = modo antigo da Sprint 1, envia o e-mail dentro do checkout (usado para comparar na Sprint 3)
    modo: ${NOTIFICACAO_MODO:fila}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # No modo fila o checkout nao depende mais do SMTP, entao o health do monolito nao olha o e-mail.
    mail:
      enabled: ${MAIL_HEALTH:false}
