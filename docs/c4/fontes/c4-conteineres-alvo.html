<text x="480" y="236" text-anchor="middle" fill="#fff" font-size="14">Checkout e pedidos</text>
<text x="480" y="258" text-anchor="middle" fill="#fff" font-size="13">Publica PedidoCriado após o commit</text>
<text x="480" y="290" text-anchor="middle" fill="#dfe9f5" font-size="13">Envio síncrono desligado</text>
<text x="480" y="310" text-anchor="middle" fill="#dfe9f5" font-size="13">(flag modo=fila | sincrono)</text>

<rect x="740" y="140" width="300" height="200" rx="14" fill="#438dd5"/>
<text x="890" y="178" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Broker de mensagens</text><text x="890" y="200" text-anchor="middle" fill="#fff" font-size="13">[RabbitMQ 3.13 – 5672/15672]</text>
<text x="890" y="234" text-anchor="middle" fill="#fff" font-size="13.5">exchange pedidos (topic)</text>
<text x="890" y="256" text-anchor="middle" fill="#fff" font-size="13.5">→ notificacoes.pedido-criado</text>
<text x="890" y="288" text-anchor="middle" fill="#fff" font-size="13.5">notificacoes.dlx → notificacoes.dlq</text>
<text x="890" y="310" text-anchor="middle" fill="#dfe9f5" font-size="13">(falhas após 3 reenvios)</text>

<text x="480" y="540" text-anchor="middle" fill="#fff" font-size="13">schema public: pedido, item_pedido</text>
<text x="480" y="566" text-anchor="middle" fill="#fff" font-size="14">schema notificacoes:</text>
<text x="480" y="588" text-anchor="middle" fill="#fff" font-size="14">evento_processado</text>

<text x="890" y="536" text-anchor="middle" fill="#fff" font-size="13.5">Consome PedidoCriado e envia o e-mail</text>
<text x="890" y="558" text-anchor="middle" fill="#fff" font-size="14">Reenvio 2 s, 4 s, 8 s e DLQ</text>
<text x="890" y="580" text-anchor="middle" fill="#fff" font-size="14">Idempotência pelo eventoId</text>
<text x="890" y="610" text-anchor="middle" fill="#d5f0dc" font-size="13">GET /dlq · POST /dlq/reprocessar</text>

<rect x="1130" y="460" width="240" height="160" rx="14" fill="#8a8a8a"/>
<text x="1250" y="500" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Servidor de e-mail</text><text x="1250" y="524" text-anchor="middle" fill="#fff" font-size="13">[Sistema externo]</text><text x="1250" y="556" text-anchor="middle" fill="#fff" font-size="14">Mailpit na PoC</text><text x="1250" y="578" text-anchor="middle" fill="#fff" font-size="14">SMTP 1025 · caixa 8025</text>
<!-- callout -->
<rect x="1110" y="130" width="270" height="250" rx="12" fill="#e8f5ec" stroke="#1e7b34" stroke-width="2"/>
<text x="1126" y="162" font-size="15.5" font-weight="bold" fill="#1e7b34">O que mudou</text>
<text x="1126" y="190" font-size="13.5" fill="#1d2420">O checkout só grava o pedido</text>
<text x="1126" y="210" font-size="13.5" fill="#1d2420">e publica o evento: o SMTP</text>
<text x="1126" y="230" font-size="13.5" fill="#1d2420">sai do caminho da compra (H1).</text>
<text x="1126" y="260" font-size="13.5" fill="#1d2420">Falha no e-mail vira reenvio</text>
<text x="1126" y="280" font-size="13.5" fill="#1d2420">e DLQ, sem perder o pedido</text>
<text x="1126" y="300" font-size="13.5" fill="#1d2420">nem duplicar o e-mail (H2).</text>
<text x="1126" y="330" font-size="13.5" fill="#1d2420">O serviço é publicado sozinho</text>
<text x="1126" y="350" font-size="13.5" fill="#1d2420">(H3).</text>
